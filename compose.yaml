services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leadflow
      MYSQL_USER: leadflow
      MYSQL_PASSWORD: leadflow_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3307:3306"
    volumes:
      - leadflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  leadflow_mysql:

