name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Clean backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Clean backend package
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript and production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag leadflow-backend:ci backend
      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL=/api/v1 --tag leadflow-web:ci frontend
      - name: Validate production Compose
        env:
          APP_DOMAIN: leadflow.example.invalid
          MYSQL_DATABASE: leadflow_ci
          DB_USERNAME: leadflow_ci
          DB_PASSWORD: safe-ci-placeholder-only
          MYSQL_ROOT_PASSWORD: different-safe-ci-placeholder-only
          AUTOMATION_API_KEY: safe-ci-automation-placeholder-only
          N8N_ENCRYPTION_KEY: safe-ci-n8n-placeholder-only
        run: docker compose -f compose.prod.yaml config --quiet

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
