spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: LEADFLOW_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.mohammadmurrar.leadflow: INFO
    org.hibernate.SQL: WARN

leadflow:
  frontend-origin: ${FRONTEND_ORIGIN}
  email-delivery:
    public-base-url: ${LEADFLOW_PUBLIC_FRONTEND_URL}
    allow-http-loopback: false
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  automation:
    api-key: ${AUTOMATION_API_KEY}
  qualification-reliability:
    dispatcher-enabled: ${QUALIFICATION_DISPATCHER_ENABLED:true}
    legacy-callback-enabled: false
    retry-enabled: true
    dispatcher-interval: ${QUALIFICATION_DISPATCHER_INTERVAL:PT5S}
    timeout-interval: ${QUALIFICATION_TIMEOUT_INTERVAL:PT1M}
    batch-size: ${QUALIFICATION_DISPATCH_BATCH_SIZE:10}
    maximum-delivery-attempts: ${QUALIFICATION_MAX_DELIVERY_ATTEMPTS:5}
    initial-backoff: ${QUALIFICATION_INITIAL_BACKOFF:PT10S}
    maximum-backoff: ${QUALIFICATION_MAX_BACKOFF:PT5M}
    lease-duration: ${QUALIFICATION_LEASE_DURATION:PT1M}
    dispatch-timeout: ${QUALIFICATION_DISPATCH_TIMEOUT:PT30M}
    processing-timeout: ${QUALIFICATION_PROCESSING_TIMEOUT:PT30M}
    timeout-batch-size: ${QUALIFICATION_TIMEOUT_BATCH_SIZE:50}

n8n:
  lead-qualification-webhook-url: ${N8N_LEAD_QUALIFICATION_WEBHOOK_URL}
