spring:
  application:
    name: leadflow-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/leadflow?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:leadflow}
    password: ${DB_PASSWORD:leadflow_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        name: LEADFLOW_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
  error:
    include-message: never
leadflow:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  automation:
    api-key: ${AUTOMATION_API_KEY:local-change-me}
  qualification-reliability:
    dispatcher-enabled: ${QUALIFICATION_DISPATCHER_ENABLED:false}
    legacy-callback-enabled: ${QUALIFICATION_LEGACY_CALLBACK_ENABLED:true}
    retry-enabled: ${QUALIFICATION_RETRY_ENABLED:false}
    dispatcher-interval: ${QUALIFICATION_DISPATCHER_INTERVAL:PT5S}
    timeout-interval: ${QUALIFICATION_TIMEOUT_INTERVAL:PT1M}
    batch-size: ${QUALIFICATION_DISPATCH_BATCH_SIZE:10}
    maximum-delivery-attempts: ${QUALIFICATION_MAX_DELIVERY_ATTEMPTS:5}
    initial-backoff: ${QUALIFICATION_INITIAL_BACKOFF:PT10S}
    maximum-backoff: ${QUALIFICATION_MAX_BACKOFF:PT5M}
    lease-duration: ${QUALIFICATION_LEASE_DURATION:PT1M}
    dispatch-timeout: ${QUALIFICATION_DISPATCH_TIMEOUT:PT30M}
    processing-timeout: ${QUALIFICATION_PROCESSING_TIMEOUT:PT30M}
    timeout-batch-size: ${QUALIFICATION_TIMEOUT_BATCH_SIZE:50}
n8n:
  lead-qualification-webhook-url: http://127.0.0.1:5678/webhook/lead-qualification
