spring:
  application:
    name: leadflow-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/leadflow?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:leadflow}
    password: ${DB_PASSWORD:leadflow_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  data:
    web:
      pageable:
        max-page-size: 200
server:
  servlet:
    session:
      cookie:
        name: LEADFLOW_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
  error:
    include-message: never
leadflow:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  provisioning:
    enabled: ${LEADFLOW_PROVISIONING_ENABLED:false}
  automation:
    api-key: ${AUTOMATION_API_KEY:local-change-me}
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    active-key-version: ${PASSWORD_RESET_ACTIVE_KEY_VERSION:}
    hmac-keys: ${PASSWORD_RESET_HMAC_KEYS:}
    token-lifetime: ${PASSWORD_RESET_TOKEN_LIFETIME:PT30M}
    request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:PT5M}
    retention: ${PASSWORD_RESET_RETENTION:PT720H}
  qualification-reliability:
    dispatcher-enabled: ${QUALIFICATION_DISPATCHER_ENABLED:false}
    legacy-callback-enabled: ${QUALIFICATION_LEGACY_CALLBACK_ENABLED:true}
    retry-enabled: ${QUALIFICATION_RETRY_ENABLED:false}
    dispatcher-interval: ${QUALIFICATION_DISPATCHER_INTERVAL:PT5S}
    timeout-interval: ${QUALIFICATION_TIMEOUT_INTERVAL:PT1M}
    batch-size: ${QUALIFICATION_DISPATCH_BATCH_SIZE:10}
    maximum-delivery-attempts: ${QUALIFICATION_MAX_DELIVERY_ATTEMPTS:5}
    initial-backoff: ${QUALIFICATION_INITIAL_BACKOFF:PT10S}
    maximum-backoff: ${QUALIFICATION_MAX_BACKOFF:PT5M}
    lease-duration: ${QUALIFICATION_LEASE_DURATION:PT1M}
    dispatch-timeout: ${QUALIFICATION_DISPATCH_TIMEOUT:PT30M}
    processing-timeout: ${QUALIFICATION_PROCESSING_TIMEOUT:PT30M}
    timeout-batch-size: ${QUALIFICATION_TIMEOUT_BATCH_SIZE:50}
  email-delivery:
    enabled: ${EMAIL_DELIVERY_ENABLED:false}
    smtp-host: ${EMAIL_SMTP_HOST:}
    smtp-port: ${EMAIL_SMTP_PORT:587}
    smtp-username: ${EMAIL_SMTP_USERNAME:}
    smtp-password: ${EMAIL_SMTP_PASSWORD:}
    smtp-auth: ${EMAIL_SMTP_AUTH:true}
    smtp-start-tls: ${EMAIL_SMTP_START_TLS:true}
    sender-address: ${EMAIL_SENDER_ADDRESS:}
    sender-display-name: ${EMAIL_SENDER_DISPLAY_NAME:LeadFlow}
    reply-to: ${EMAIL_REPLY_TO:}
    public-base-url: ${LEADFLOW_PUBLIC_FRONTEND_URL:}
    allow-http-loopback: ${LEADFLOW_PUBLIC_FRONTEND_ALLOW_HTTP_LOOPBACK:false}
    batch-size: ${EMAIL_DELIVERY_BATCH_SIZE:10}
    scheduler-interval: ${EMAIL_DELIVERY_INTERVAL:PT30S}
    lease-duration: ${EMAIL_DELIVERY_LEASE_DURATION:PT2M}
    maximum-delivery-attempts: ${EMAIL_MAX_DELIVERY_ATTEMPTS:5}
    initial-backoff: ${EMAIL_INITIAL_BACKOFF:PT30S}
    maximum-backoff: ${EMAIL_MAX_BACKOFF:PT30M}
    connection-timeout: ${EMAIL_CONNECTION_TIMEOUT:PT10S}
    read-timeout: ${EMAIL_READ_TIMEOUT:PT10S}
    write-timeout: ${EMAIL_WRITE_TIMEOUT:PT10S}
n8n:
  lead-qualification-webhook-url: http://127.0.0.1:5678/webhook/lead-qualification
